services:
  - type: web
    name: tw-stocks
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Optional: point DATABASE_URL at a Render PostgreSQL instance so the
      # price cache survives restarts (needs psycopg2-binary in requirements).
