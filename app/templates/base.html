<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}量化研究室{% endblock %}</title>
<style>
:root{--ink:#17202a;--muted:#5f6c76;--line:#dfe5ea;--bg:#f5f7f9;--card:#fff;--brand:#0b6e69;
--good:#16834b;--good-bg:#e4f6ed;--warn:#a46a00;--warn-bg:#fff4d6;--bad:#c0392b;--bad-bg:#fde8e6}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
max-width:1200px;margin:0 auto;padding:24px 16px 60px;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:var(--brand)}
h1{margin:0 0 2px;font-size:26px}h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:18px 0 8px}
header{border-left:5px solid var(--brand);padding-left:14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;background:#e0efee;color:var(--brand);font-size:13px;font-weight:600}
nav{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
nav a{padding:7px 12px;background:var(--card);text-decoration:none;border:1px solid var(--line);border-radius:6px;font-size:14px}
nav a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
form.controls,.panel{background:var(--card);padding:16px;overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:14px}
form.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
form.controls fieldset{border:0;padding:0;margin:0;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
form.controls legend{font-size:12px;color:var(--muted);font-weight:600;padding:0;margin-bottom:4px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select{padding:8px;border:1px solid #bac5ce;border-radius:5px;width:110px;font-size:14px;color:var(--ink);background:#fff}
input.wide{width:320px;max-width:100%}
label.check{display:flex;align-items:center;gap:6px}label.check input{width:auto}
button{padding:9px 18px;background:var(--brand);color:#fff;border:0;border-radius:5px;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.tab{background:#e3e8ec;color:var(--ink)}.tab.active{background:var(--brand);color:#fff}
.content{display:none}.content.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.card{background:var(--card);padding:12px 14px;border-top:3px solid var(--brand);border-radius:4px}
.card span{display:block;color:var(--muted);font-size:12.5px}
.card strong{display:block;font-size:21px;margin-top:4px}
.card small{color:var(--muted);font-size:12px}
.chart{background:var(--card);padding:6px;border:1px solid var(--line);border-radius:8px;margin-top:14px;overflow:hidden}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.content{max-width:100%;overflow-x:hidden}
table.t td,table.t th{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600;font-size:12.5px}
table.t tr.sel td{background:#eef7f6;font-weight:600}
.scroll{overflow-x:auto;max-height:420px}
.hint,small{color:var(--muted)}
.note{padding:10px 14px;margin-top:10px;border-radius:6px;border-left:4px solid}
.note.good{background:var(--good-bg);border-color:var(--good)}
.note.warn{background:var(--warn-bg);border-color:#d99000}
.note.bad{background:var(--bad-bg);border-color:var(--bad)}
.buy{color:#d33;font-weight:600}.sell{color:var(--good);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar{height:8px;background:var(--brand);border-radius:4px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}input.wide{width:100%}h1{font-size:22px}}
</style>
</head>
<body>
{% set active = active|default('') %}
<nav>
<a href="/dashboard?symbol={{ symbol|default('2330.TW')|urlencode }}" class="{{ 'on' if active=='dashboard' }}">研究室</a>
<a href="/portfolio" class="{{ 'on' if active=='portfolio' }}">投資組合</a>
<a href="/risk-dashboard?symbol={{ symbol|default('2330.TW')|urlencode }}" class="{{ 'on' if active=='risk' }}">風險管理</a>
<a href="/guide" class="{{ 'on' if active=='guide' }}">📘 分析方法教學</a>
<a href="/docs">API</a>
</nav>
{% block body %}{% endblock %}
<p class="hint" style="margin-top:30px">歷史回測與教學用途，不構成投資建議。過去績效不代表未來結果。</p>
</body>
</html>
